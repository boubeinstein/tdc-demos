<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#20242a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DACUM Board — Flight Dispatcher</title>
<style>
  :root{
    --wall:#f5efe2; --wall-edge:#e7dfcc;
    --job:#e88fa4; --func:#7db3d6; --task:#f2d349; --sub:#a8dcc4;
    --ink:#1d2733; --ink-soft:#4a5568;
    --tape:rgba(222,205,140,.85);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif; background:#2b2f36; color:var(--ink);
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    background:#20242a; color:#e8ecf2; flex-wrap:wrap;
  }
  header h1{font-size:16px; font-weight:600; letter-spacing:.02em; margin-right:6px;}
  header .sub{font-size:12px; color:#9aa6b5;}
  #hdrGroup, #hdrSession{border-bottom:1px dashed #6b7686; cursor:pointer; padding:0 2px 1px;}
  #hdrGroup[contenteditable="true"], #hdrSession[contenteditable="true"]{background:#3a4250; color:#fff; border-radius:4px; outline:none; border-bottom-color:transparent;}
  .btn{
    font:600 13px/1 "Segoe UI",system-ui,sans-serif; color:#e8ecf2; background:#3a4250;
    border:1px solid #4d5768; border-radius:7px; padding:8px 14px; cursor:pointer;
    transition:background .15s;
  }
  .btn:hover{background:#495468;}
  .btn.primary{background:#3e6ea5; border-color:#5585bd;}
  .btn.primary:hover{background:#4a7fbc;}
  .btn.toggled{background:#2e7d5b; border-color:#3fa578;}
  .spacer{flex:1;}
  .hint{font-size:12px; color:#8b97a7;}
  #board-wrap{flex:1; position:relative; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;}
  #zoom{position:relative; transform-origin:0 0;}
  #board{
    position:absolute; left:0; top:0; width:1500px; height:950px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 55%),
      linear-gradient(var(--wall), var(--wall-edge));
  }
  #board::after{ /* skirting */
    content:""; position:absolute; left:0; right:0; bottom:0; height:14px;
    background:#cbbfa4; box-shadow:0 -2px 4px rgba(0,0,0,.12);
  }
  svg#links{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  svg#links line{stroke:#8a93a1; stroke-width:2; stroke-dasharray:5 6; opacity:.65;}
  .card{
    position:absolute; width:150px; min-height:96px; padding:26px 10px 12px;
    box-shadow:2px 4px 9px rgba(0,0,0,.22);
    cursor:grab; user-select:none;
    transition:left .8s cubic-bezier(.2,.7,.25,1), top .8s cubic-bezier(.2,.7,.25,1),
               transform .8s cubic-bezier(.2,.7,.25,1), opacity .5s;
    text-align:center;
  }
  .card.dragging{transition:none; cursor:grabbing; z-index:60; box-shadow:4px 10px 22px rgba(0,0,0,.32);}
  .card::before{ /* masking tape */
    content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:64px; height:18px; background:var(--tape);
    box-shadow:0 1px 2px rgba(0,0,0,.15); opacity:.95;
  }
  .card .tag{
    display:block; font:700 10px/1.5 "Segoe UI",system-ui,sans-serif;
    letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft);
    text-decoration:underline; margin-bottom:5px;
  }
  .card .txt{
    font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
    font-size:13px; line-height:1.35; font-weight:600; outline:none; min-height:40px;
  }
  .card .txt[contenteditable="true"]{background:rgba(255,255,255,.5); border-radius:4px;}
  .card.job{background:var(--job); width:170px; z-index:6;}
  .card.func{background:var(--func); width:170px; z-index:5;}
  .card.task{background:var(--task); z-index:4;}
  .card.sub{background:var(--sub); z-index:3;}
  .card.hidden-card{opacity:0; pointer-events:none; transform:translateY(18px);}
  .card.linksel{outline:3px solid #3e6ea5; outline-offset:3px;}
  .card .del{
    position:absolute; top:2px; right:4px; border:none; background:none; color:rgba(0,0,0,.35);
    font-size:13px; cursor:pointer; display:none; padding:2px;
  }
  .card:hover .del{display:block;}
  .card .del:hover{color:rgba(0,0,0,.7);}
  footer{
    padding:7px 18px; background:#20242a; color:#8b97a7; font-size:12px;
    display:flex; gap:18px; flex-wrap:wrap;
  }
  #present-note{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    background:rgba(32,36,42,.92); color:#e8ecf2; font-size:14px; padding:10px 20px;
    border-radius:9px; display:none; z-index:80;
  }
  #addMenu{
    position:absolute; z-index:90; display:none; background:#fff; border-radius:9px;
    box-shadow:0 8px 26px rgba(0,0,0,.3); overflow:hidden; top:54px; left:18px;
  }
  #addMenu button{
    display:block; width:190px; border:none; text-align:left; padding:11px 15px;
    font:600 13px "Segoe UI",system-ui,sans-serif; cursor:pointer; color:var(--ink);
  }
  #addMenu button:hover{filter:brightness(.95);}
  #addMenu .m-job{background:var(--job);} #addMenu .m-func{background:var(--func);}
  #addMenu .m-task{background:var(--task);} #addMenu .m-sub{background:var(--sub);}
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:rgba(32,36,42,.95);
    color:#e8ecf2; font-size:13px; padding:10px 18px; border-radius:9px; display:none; z-index:120;
    max-width:92vw; text-align:center; line-height:1.4;
  }
</style>
</head>
<body>
<header>
  <h1>DACUM Board</h1>
  <span class="sub"><span id="hdrJob">Flight Dispatcher</span> &middot; <span id="hdrGroup" title="Tap to edit your group name">Group 1</span> &middot; <span id="hdrSession" title="Tap to edit batch and location">TDC Batch 8, Abuja</span></span>
  <button class="btn" id="btnScatter" title="Scatter the cards as at the start of a brainstorming session">Brainstorm</button>
  <button class="btn primary" id="btnArrange" title="Assemble the cards into the DACUM chart">Build the chart</button>
  <button class="btn" id="btnLinks">Links: on</button>
  <button class="btn" id="btnAdd">+ Add card</button>
  <button class="btn" id="btnLink" title="Link a card to its parent">Link</button>
  <button class="btn" id="btnPresent">Present</button>
  <button class="btn" id="btnZoomOut" title="Zoom out">&minus;</button>
  <button class="btn" id="btnZoomFit" title="Fit to screen">Fit</button>
  <button class="btn" id="btnZoomIn" title="Zoom in">+</button>
  <span class="spacer"></span>
  <span class="hint">Drag a card &middot; double-tap to edit</span>
</header>

<div id="board-wrap">
  <div id="zoom">
  <div id="board">
    <svg id="links"></svg>
  </div>
  </div>
  <div id="toast"></div>
  <div id="present-note">Press <b>Space</b> or click to reveal the next level — Job → Functions → Tasks → Subtasks</div>
  <div id="addMenu">
    <button class="m-job"  data-type="job">Job title card</button>
    <button class="m-func" data-type="func">Function card</button>
    <button class="m-task" data-type="task">Task card</button>
    <button class="m-sub"  data-type="sub">Subtask card</button>
  </div>
</div>

<footer>
  <span><b style="color:#e8bfca">&#9632;</b> Job title</span>
  <span><b style="color:#7db3d6">&#9632;</b> Function</span>
  <span><b style="color:#f2d349">&#9632;</b> Task</span>
  <span><b style="color:#a8dcc4">&#9632;</b> Subtask</span>
  <span class="spacer"></span>
  <span id="ftrLine">Flight Dispatcher DACUM — Group 1, TDC Module 4 · NCAT (Zaria)</span>
</footer>

<script>
(function(){
  "use strict";
  const BOARD_W = 1500, BOARD_H = 950;
  const board = document.getElementById('board');
  const zoomEl = document.getElementById('zoom');
  const wrap = document.getElementById('board-wrap');
  let scale = 1;
  function setScale(v){
    scale = Math.min(2.5, Math.max(0.25, v));
    zoomEl.style.transform = 'scale(' + scale + ')';
    zoomEl.style.width  = (BOARD_W * scale) + 'px';
    zoomEl.style.height = (BOARD_H * scale) + 'px';
  }
  function fitScale(){
    setScale(Math.min(wrap.clientWidth / BOARD_W, wrap.clientHeight / BOARD_H));
  }
  const svg = document.getElementById('links');
  let uid = 0;
  const cards = [];   // {id,type,tag,text,parent,el,x,y,rot,hiddenLevel}

  const LEVELS = {job:0, func:1, task:2, sub:3};

  function addCard(type, tag, text, parent){
    const id = 'c' + (++uid);
    const el = document.createElement('div');
    el.className = 'card ' + type;
    el.innerHTML = '<button class="del" title="Remove card">&times;</button>' +
                   '<span class="tag"></span><div class="txt"></div>';
    el.querySelector('.tag').textContent = tag;
    el.querySelector('.txt').textContent = text;
    board.appendChild(el);
    const c = {id, type, parent, el, x:0, y:0, rot:0};
    cards.push(c);
    wire(c);
    return c;
  }

  /* ------- Flight Dispatcher DACUM data ------- */
  const job = addCard('job','Job Title','Flight Dispatcher', null);
  const f1  = addCard('func','Function 1.0','Perform operational flight planning', job.id);
  const f2  = addCard('func','Function 2.0','Monitor flights in operation', job.id);
  const t11 = addCard('task','Task 1.1','Analyse the meteorological conditions for the flight', f1.id);
  const t12 = addCard('task','Task 1.2','Determine the route and flight levels for the flight', f1.id);
  const t13 = addCard('task','Task 1.3','Calculate the fuel required for the flight', f1.id);
  const t21 = addCard('task','Task 2.1','Monitor the progress of each flight against the operational flight plan', f2.id);
  const t22 = addCard('task','Task 2.2','Inform the pilot-in-command of significant operational changes', f2.id);
  const t23 = addCard('task','Task 2.3','Initiate the applicable emergency procedures', f2.id);
  addCard('sub','Subtask 1.1.1','Obtain the meteorological reports and forecasts for the route and aerodromes', t11.id);
  addCard('sub','Subtask 1.1.2','Determine the operational impact of significant weather on the flight', t11.id);
  addCard('sub','Subtask 1.2.1','Check the NOTAMs and airspace restrictions along the intended route', t12.id);
  addCard('sub','Subtask 1.2.2','Select the route and cruising levels for the operational flight plan', t12.id);
  addCard('sub','Subtask 1.3.1','Estimate the trip, contingency, alternate and reserve fuel quantities', t13.id);
  addCard('sub','Subtask 1.3.2','Verify the fuel figures against the aircraft load and performance limits', t13.id);
  addCard('sub','Subtask 2.1.1','Scan the flight tracking and position report information', t21.id);
  addCard('sub','Subtask 2.1.2','Detect deviations from the operational flight plan', t21.id);
  addCard('sub','Subtask 2.2.1','Obtain the updated meteorological and NOTAM information affecting the flight', t22.id);
  addCard('sub','Subtask 2.2.2','Relay the updated operational information to the flight crew', t22.id);
  addCard('sub','Subtask 2.3.1','Notify the authorities and company departments concerned', t23.id);
  addCard('sub','Subtask 2.3.2','Record the events and the actions taken', t23.id);

  /* ------- layout ------- */
  function place(c, x, y, rot){
    c.x = x; c.y = y; c.rot = (rot===undefined ? c.rot : rot);
    c.el.style.left = x + 'px';
    c.el.style.top  = y + 'px';
    c.el.style.transform = 'rotate(' + c.rot + 'deg)';
  }

  function arrange(){
    const W = BOARD_W, H = BOARD_H;
    const cw = 160, gap = 18;
    const jobC   = cards.filter(c=>c.type==='job');
    const funcs  = cards.filter(c=>c.type==='func');
    const rowY = {job: 26, func: 158, task: 292, sub0: 436, subStep: 132};
    // job centred
    jobC.forEach((c,i)=> place(c, W/2 - 85 + i*190, rowY.job, rand(-1.5,1.5)));
    // group tasks under each function
    const groups = funcs.map(f=>({f, tasks: cards.filter(c=>c.type==='task' && c.parent===f.id)}));
    const widths = groups.map(g=> Math.max(1, g.tasks.length) * (cw+gap) - gap);
    const total = widths.reduce((a,b)=>a+b,0) + (groups.length-1)*46;
    let gx = Math.max(14, (W - total)/2);
    groups.forEach((g,gi)=>{
      const gw = widths[gi];
      place(g.f, gx + gw/2 - 85, rowY.func, rand(-1.5,1.5));
      g.tasks.forEach((t,ti)=>{
        const tx = gx + ti*(cw+gap);
        place(t, tx, rowY.task, rand(-2,2));
        const subs = cards.filter(c=>c.type==='sub' && c.parent===t.id);
        subs.forEach((s,si)=> place(s, tx, rowY.sub0 + si*rowY.subStep, rand(-2,2)));
      });
      gx += gw + 46;
    });
    // orphan tasks/subs (added without parent): park bottom-left
    let ox = 16, oy = H - 150;
    cards.filter(c=> c.type!=='job' && !cards.some(p=>p.id===c.parent)).forEach(c=>{
      place(c, ox, oy, rand(-4,4)); ox += 170; if (ox > W-180){ ox = 16; oy -= 130; }
    });
    requestAnimationFrame(()=>{ setTimeout(drawLinks, 820); });
    drawLinksSoon();
  }

  function scatter(){
    const W = BOARD_W, H = BOARD_H;
    cards.forEach(c=>{
      place(c, rand(20, W-190), rand(30, H-160), rand(-14,14));
    });
    drawLinksSoon();
  }

  function rand(a,b){ return a + Math.random()*(b-a); }

  /* ------- links ------- */
  let linksOn = true;
  function drawLinks(){
    svg.innerHTML = '';
    if(!linksOn) return;
    cards.forEach(c=>{
      if(!c.parent) return;
      const p = cards.find(k=>k.id===c.parent);
      if(!p) return;
      const l = document.createElementNS('http://www.w3.org/2000/svg','line');
      const cw = c.el.offsetWidth/2, ph = p.el.offsetHeight, pw = p.el.offsetWidth/2;
      l.setAttribute('x1', p.x + pw); l.setAttribute('y1', p.y + ph);
      l.setAttribute('x2', c.x + cw); l.setAttribute('y2', c.y);
      svg.appendChild(l);
    });
  }
  let linkTimer = null;
  function drawLinksSoon(){ clearTimeout(linkTimer); linkTimer = setTimeout(drawLinks, 850); drawLinks(); }

  const toastEl = document.getElementById('toast');
  function toast(m){
    toastEl.textContent = m; toastEl.style.display = 'block';
    clearTimeout(toastEl._h); toastEl._h = setTimeout(()=> toastEl.style.display='none', 3800);
  }

  /* ------- link mode ------- */
  let linking = false, linkChild = null;
  const TYPENAME = {job:'job title', func:'function', task:'task', sub:'subtask'};
  const PARENTNAME = {func:'job title', task:'function', sub:'task'};
  function clearLinkSel(){
    if(linkChild){ linkChild.el.classList.remove('linksel'); linkChild = null; }
  }
  function handleLinkTap(c){
    if(!linkChild){
      if(c.type === 'job'){
        toast('The job title card is the top of the hierarchy. Start with the card to be linked: tap a function, task or subtask first.');
        return;
      }
      linkChild = c;
      c.el.classList.add('linksel');
      toast('Now tap the ' + PARENTNAME[c.type] + ' card this ' + TYPENAME[c.type] + ' belongs to. Tap the same card again to unlink it.');
      return;
    }
    if(c === linkChild){
      c.parent = null;
      clearLinkSel();
      toast('Card unlinked. Use Build the chart to re-arrange.');
      drawLinks();
      return;
    }
    if(LEVELS[c.type] !== LEVELS[linkChild.type] - 1){
      toast('A ' + TYPENAME[linkChild.type] + ' links to a ' + PARENTNAME[linkChild.type] + ' card — tap a ' + PARENTNAME[linkChild.type] + '.');
      return;
    }
    const oldParent = cards.find(k=>k.id===linkChild.parent);
    linkChild.parent = c.id;
    const childTag = linkChild.el.querySelector('.tag').textContent;
    const newTag = c.el.querySelector('.tag').textContent;
    toast(oldParent
      ? childTag + ' re-linked from ' + oldParent.el.querySelector('.tag').textContent + ' to ' + newTag + '. Use Build the chart to re-arrange.'
      : childTag + ' linked to ' + newTag + '. Use Build the chart to place it in the hierarchy.');
    clearLinkSel();
    drawLinks();
  }

  /* ------- interactions ------- */
  function wire(c){
    const el = c.el;
    el.addEventListener('pointerdown', e=>{
      if(e.target.closest('.del') || e.target.closest('[contenteditable="true"]')) return;
      e.preventDefault();
      if(linking){ handleLinkTap(c); return; }
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      const sx = e.clientX, sy = e.clientY, ox = c.x, oy = c.y;
      function mv(ev){
        c.x = ox + (ev.clientX - sx)/scale; c.y = oy + (ev.clientY - sy)/scale;
        el.style.left = c.x+'px'; el.style.top = c.y+'px';
        drawLinks();
      }
      function up(ev){
        el.classList.remove('dragging');
        el.removeEventListener('pointermove', mv);
        el.removeEventListener('pointerup', up);
        drawLinks();
      }
      el.addEventListener('pointermove', mv);
      el.addEventListener('pointerup', up);
    });
    el.addEventListener('dblclick', ()=>{
      const t = el.querySelector('.txt');
      t.setAttribute('contenteditable','true');
      t.focus();
      document.execCommand && document.execCommand('selectAll', false, null);
    });
    el.querySelector('.txt').addEventListener('input', ()=>{
      if(c.type==='job' && typeof syncTitles === 'function') syncTitles();
    });
    el.querySelector('.txt').addEventListener('blur', ev=>{
      ev.target.removeAttribute('contenteditable');
      if(c.type==='job'){
        try{ localStorage.setItem('dacum.job', ev.target.textContent.trim()); }catch(e){}
        syncTitles();
      }
    });
    el.querySelector('.txt').addEventListener('keydown', ev=>{
      if(ev.key==='Enter'){ ev.preventDefault(); ev.target.blur(); }
    });
    el.querySelector('.del').addEventListener('click', ()=>{
      const kids = cards.filter(k=>k.parent===c.id);
      if(kids.length){
        const kindName = {job:'function', func:'task', task:'subtask'}[c.type] || 'card';
        toast('This ' + TYPENAME[c.type] + ' still has ' + kids.length + ' linked ' + kindName + ' card' + (kids.length>1?'s':'') + '. Deletion is bottom-up: delete or re-link those cards first.');
        return;
      }
      if(linkChild===c) clearLinkSel();
      const i = cards.indexOf(c);
      if(i>-1) cards.splice(i,1);
      el.remove();
      drawLinks();
    });
  }

  /* ------- title bar sync ------- */
  const hdrJob = document.getElementById('hdrJob');
  const hdrGroup = document.getElementById('hdrGroup');
  const ftrLine = document.getElementById('ftrLine');
  function jobCard(){ return cards.find(c=>c.type==='job'); }
  function syncTitles(){
    const jc = jobCard();
    const j = (jc ? jc.el.querySelector('.txt').textContent.trim() : '') || 'DACUM';
    const g = hdrGroup.textContent.trim() || 'Group 1';
    hdrJob.textContent = j;
    ftrLine.textContent = j + ' DACUM \u2014 ' + g + ', TDC Module 4 \u00b7 NCAT (Zaria)';
    document.title = 'DACUM Board \u2014 ' + j + ' (' + g + ')';
  }
  function saveGroup(){
    const g = hdrGroup.textContent.trim() || 'Group 1';
    hdrGroup.textContent = g;
    try{ localStorage.setItem('dacum.group', g); }catch(e){}
    syncTitles();
  }
  (function loadConfig(){
    let g = null, j = null, se = null;
    try{
      const q = new URLSearchParams(location.search);
      g = q.get('group'); j = q.get('job'); se = q.get('session');
    }catch(e){}
    if(!g){ try{ g = localStorage.getItem('dacum.group'); }catch(e){} }
    if(!j){ try{ j = localStorage.getItem('dacum.job'); }catch(e){} }
    if(!se){ try{ se = localStorage.getItem('dacum.session'); }catch(e){} }
    if(g) hdrGroup.textContent = g;
    if(se) document.getElementById('hdrSession').textContent = se;
    const jc = jobCard();
    if(j && jc) jc.el.querySelector('.txt').textContent = j;
  })();
  const hdrSession = document.getElementById('hdrSession');
  function editable(el, onDone){
    el.addEventListener('click', ()=>{
      if(el.getAttribute('contenteditable')==='true') return;
      el.setAttribute('contenteditable','true');
      el.focus();
      const r = document.createRange(); r.selectNodeContents(el);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
    el.addEventListener('blur', ()=>{ el.removeAttribute('contenteditable'); onDone(); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
  }
  function saveSession(){
    const v = hdrSession.textContent.trim() || 'TDC Batch 8, Abuja';
    hdrSession.textContent = v;
    try{ localStorage.setItem('dacum.session', v); }catch(e){}
  }
  editable(hdrGroup, saveGroup);
  editable(hdrSession, saveSession);
  syncTitles();

  /* ------- toolbar ------- */
  document.getElementById('btnArrange').addEventListener('click', ()=>{ exitPresent(); arrange(); });
  document.getElementById('btnScatter').addEventListener('click', ()=>{ exitPresent(); scatter(); });

  const btnLinks = document.getElementById('btnLinks');
  btnLinks.addEventListener('click', ()=>{
    linksOn = !linksOn;
    btnLinks.textContent = 'Links: ' + (linksOn ? 'on' : 'off');
    btnLinks.classList.toggle('toggled', !linksOn);
    drawLinks();
  });

  const addMenu = document.getElementById('addMenu');
  document.getElementById('btnAdd').addEventListener('click', e=>{
    e.stopPropagation();
    addMenu.style.display = addMenu.style.display==='block' ? 'none' : 'block';
  });
  document.addEventListener('click', ()=> addMenu.style.display='none');
  addMenu.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const type = b.dataset.type;
      const tags = {job:'Job Title', func:'Function', task:'Task', sub:'Subtask'};
      const c = addCard(type, tags[type], 'New ' + tags[type].toLowerCase() + ' — double-click to edit', null);
      place(c, BOARD_W/2 - 80 + rand(-60,60), BOARD_H/2 - 60 + rand(-40,40), rand(-6,6));
      addMenu.style.display = 'none';
    });
  });

  const btnLink = document.getElementById('btnLink');
  btnLink.addEventListener('click', ()=>{
    linking = !linking;
    btnLink.classList.toggle('toggled', linking);
    btnLink.textContent = linking ? 'Linking\u2026' : 'Link';
    clearLinkSel();
    if(linking) toast('Link mode: tap a card, then tap its parent. Tap the same card twice to unlink. Press Link again to finish.');
  });

  /* ------- present mode ------- */
  let presenting = false, level = -1;
  const note = document.getElementById('present-note');
  const btnPresent = document.getElementById('btnPresent');
  function enterPresent(){
    presenting = true; level = -1;
    btnPresent.classList.add('toggled'); btnPresent.textContent = 'Exit present';
    arrange();
    cards.forEach(c=> c.el.classList.add('hidden-card'));
    svg.style.display = 'none';
    note.style.display = 'block';
    step();
  }
  function exitPresent(){
    if(!presenting) return;
    presenting = false;
    btnPresent.classList.remove('toggled'); btnPresent.textContent = 'Present';
    cards.forEach(c=> c.el.classList.remove('hidden-card'));
    svg.style.display = '';
    note.style.display = 'none';
    drawLinks();
  }
  function step(){
    level++;
    if(level > 3){ exitPresent(); return; }
    cards.forEach(c=>{ if(LEVELS[c.type]===level) c.el.classList.remove('hidden-card'); });
    if(level===3){ svg.style.display=''; setTimeout(drawLinks, 600); note.innerHTML = 'Chart complete — press <b>Space</b> to finish'; }
  }
  btnPresent.addEventListener('click', ()=> presenting ? exitPresent() : enterPresent());
  document.addEventListener('keydown', e=>{
    if(presenting && (e.key===' ' || e.key==='Enter' || e.key==='ArrowRight')){ e.preventDefault(); step(); }
  });
  board.addEventListener('click', e=>{
    if(presenting && !e.target.closest('.card')) step();
    if(linking && !e.target.closest('.card')) clearLinkSel();
  });

  document.getElementById('btnZoomIn').addEventListener('click', ()=> setScale(scale * 1.25));
  document.getElementById('btnZoomOut').addEventListener('click', ()=> setScale(scale / 1.25));
  document.getElementById('btnZoomFit').addEventListener('click', fitScale);

  /* two-finger pinch zoom */
  let pinch = null;
  wrap.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      pinch = { d: dist(e.touches), s: scale };
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', e=>{
    if(pinch && e.touches.length===2){
      e.preventDefault();
      setScale(pinch.s * dist(e.touches)/pinch.d);
    }
  }, {passive:false});
  wrap.addEventListener('touchend', ()=>{ pinch = null; }, {passive:true});
  function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy)||1; }

  window.addEventListener('resize', fitScale);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  /* start assembled, fitted to the screen */
  arrange();
  fitScale();
})();
</script>
</body>
</html>
